name: Test BDGest access

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Curl BDGest
        run: |
          URL='https://www.bdgest.com/sorties_bd?DL=11%2F2026'
          echo "== headers =="
          curl -s -o /dev/null -D - --max-time 45 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36' "$URL" || true
          echo "== body =="
          curl -s -L --max-time 45 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36' "$URL" -o /tmp/bdgest.html || true
          wc -c /tmp/bdgest.html || true
          grep -o 'bdg-cal-day' /tmp/bdgest.html | wc -l || true
          head -c 600 /tmp/bdgest.html || true
